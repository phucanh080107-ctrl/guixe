<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gửi xe ở PTIT</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#1b1f2a;--mut:#5b6475;--red:#c8102e;--on:#fff;--ok:#1f8a4c;--okb:#e3f4ea;--badb:#fde8eb;--line:#d5dbe6;--chip:#fff3c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--ink:#eef1f7;--mut:#9aa4b8;--red:#ff4d63;--on:#12151c;--ok:#4cd08a;--okb:#16301f;--badb:#3a1a20;--line:#2d3444;--chip:#3b3414}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--ink:#eef1f7;--mut:#9aa4b8;--red:#ff4d63;--on:#12151c;--ok:#4cd08a;--okb:#16301f;--badb:#3a1a20;--line:#2d3444;--chip:#3b3414}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:1.5rem;font-weight:800;margin:0 0 10px}
.stage{position:relative;aspect-ratio:720/526;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:#999}
.stage img{position:absolute;inset:0;width:100%;height:100%}
#bg2,#bg3,#bg4,#bg5{opacity:0;transition:opacity .9s}
.abs{position:absolute;transform:translate(-50%,-92%)}
#rider{left:-15%;top:83%;width:26%;transition-property:left,top,width,opacity;transition-duration:2.4s;transition-timing-function:ease-in-out}
#guard{left:80%;top:93%;width:11%;transition:opacity .6s}
.nt{transition:none!important}
svg{display:block;width:100%;height:auto;overflow:visible}
.w{transform-box:fill-box;transform-origin:center}
.roll .w{animation:sp .3s linear infinite}
.roll svg{animation:bump .3s ease-in-out infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes bump{50%{transform:translateY(-1.5px)}}
.garm{transform-origin:30px 62px;transition:transform .35s}
.ext .garm{transform:rotate(80deg)}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translate(-50%,-92%) rotate(-3deg)}75%{transform:translate(-50%,-92%) rotate(3deg)}}
#card{position:absolute;left:73%;top:75%;transform:translate(-50%,-50%);width:9%;aspect-ratio:3/2;background:#ffd23f;color:#3a2f00;border:1px solid #b8921a;border-radius:4px;font-size:clamp(6px,1.6vw,10px);font-weight:800;display:flex;align-items:center;justify-content:center;opacity:0;transition:left .9s,top .9s,opacity .3s}
#bub{position:absolute;right:2%;bottom:36%;max-width:44%;background:#fff;color:#1b1f2a;border-radius:12px;padding:6px 10px;font-size:clamp(.68rem,2.5vw,.9rem);font-weight:600;opacity:0;transition:opacity .25s;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.panel{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.q{font-weight:800;margin:0 0 10px}
.opts{display:grid;gap:8px}
button{font:inherit;cursor:pointer}
.opt{text-align:left;padding:11px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--red)}
.opt.bad{border-color:var(--red);background:var(--badb)}.opt.ok{border-color:var(--ok);background:var(--okb)}
.go{background:var(--red);color:var(--on);border:0;border-radius:10px;padding:11px 20px;font-weight:800}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.msg{margin:10px 0 0;padding:9px 12px;border-radius:10px;font-weight:600;background:var(--badb)}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:3px 10px;font-weight:600;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

#walker{left:-15%;top:95%;width:11%;opacity:0;transition-property:left,top,width,opacity;transition-duration:2.4s;transition-timing-function:linear}
.la,.lb{transform-origin:30px 78px}.wa,.wb{transform-origin:30px 42px;transition:transform .35s}
.ext .wb{transform:rotate(-80deg)}
.walk .la,.walk .wa{animation:lg .6s ease-in-out infinite alternate}
.walk .lb,.walk .wb{animation:lg .6s ease-in-out infinite alternate-reverse}
.walk .wa,.walk .wb{animation-name:ar}
@keyframes lg{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes ar{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
.walk svg{animation:bump .3s ease-in-out infinite}
#lib{left:68%;top:62.2%;width:14%;opacity:0;transition:opacity .6s;transform:translate(-50%,-100%)}
#lib.shake{animation:sh2 .4s}
@keyframes sh2{25%{transform:translate(-50%,-100%) rotate(-3deg)}75%{transform:translate(-50%,-100%) rotate(3deg)}}
#book{inset:auto;left:60%;top:53%;transform:translate(-50%,-50%);width:6.5%;height:auto;opacity:0;transition:left .9s,top .9s,opacity .3s;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.tag{display:inline-block;font-size:.75rem;font-weight:800;color:var(--red);margin-bottom:4px}
</style></head><body><main>

{q:"Địa chỉ IP nào thường được gọi là localhost?",o:["127.0.0.1","192.168.1.1","8.8.8.8","255.255.255.0"],h:"Đó là địa chỉ trỏ về chính máy tính của bạn."},
{q:"Đèn vàng nhấp nháy ở ngã tư có nghĩa là gì?",o:["Giảm tốc độ, quan sát và nhường đường khi cần","Tăng tốc nhanh để qua","Phải dừng hẳn một phút","Cấm mọi phương tiện đi qua"],h:"Bạn vẫn được đi, nhưng phải thận trọng."}];
var Q2=[
{q:"Chủ nghĩa Mác – Lênin gồm ba bộ phận cấu thành. Ngoài Chủ nghĩa xã hội khoa học, hai bộ phận còn lại là gì?",o:["Triết học Mác – Lênin và Kinh tế chính trị Mác – Lênin","Triết học Mác – Lênin và Lịch sử Đảng Cộng sản Việt Nam","Kinh tế chính trị Mác – Lênin và Tư tưởng Hồ Chí Minh","Xã hội học và Chính trị học"],h:"Ba bộ phận: triết học, kinh tế chính trị và chủ nghĩa xã hội khoa học."},
{q:"Ai là hai nhà sáng lập Chủ nghĩa xã hội khoa học?",o:["C. Mác và Ph. Ăngghen","V.I. Lênin và Ph. Ăngghen","C. Mác và V.I. Lênin","Hồ Chí Minh và V.I. Lênin"],h:"Hai người bạn đồng hành, cùng viết một bản tuyên ngôn nổi tiếng năm 1848."},
{q:"Tác phẩm nào được coi là văn kiện có tính cương lĩnh đầu tiên của chủ nghĩa xã hội khoa học (năm 1848)?",o:["Tuyên ngôn của Đảng Cộng sản","Tư bản","Nhà nước và cách mạng","Làm gì?"],h:"Tác phẩm do Mác và Ăngghen viết, ra đời năm 1848."},
{q:"Sứ mệnh lịch sử của giai cấp công nhân là gì?",o:["Xóa bỏ chế độ tư bản chủ nghĩa, xây dựng xã hội xã hội chủ nghĩa và cộng sản chủ nghĩa","Duy trì chế độ tư hữu về tư liệu sản xuất","Chỉ đấu tranh để tăng lương, giảm giờ làm","Liên minh với giai cấp tư sản để cai trị xã hội"],h:"Sứ mệnh là xóa bỏ chế độ cũ và xây dựng xã hội mới, không chỉ đòi quyền lợi kinh tế."},
{q:"Bản chất của nền dân chủ xã hội chủ nghĩa là gì?",o:["Quyền lực thuộc về nhân dân, nhân dân là chủ","Quyền lực thuộc về một nhóm nhỏ người giàu","Quyền lực thuộc về giai cấp tư sản","Chỉ mang tính hình thức, không có quyền thực tế"],h:"Nhìn lại tên trò chơi: Đấu trường dân chủ. Dân là chủ!"},
{q:"Thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam là quá độ như thế nào?",o:["Quá độ gián tiếp, bỏ qua chế độ tư bản chủ nghĩa","Quá độ trực tiếp từ chủ nghĩa tư bản phát triển cao","Quá độ phải trải qua đầy đủ chế độ tư bản chủ nghĩa","Không cần có thời kỳ quá độ"],h:"Việt Nam xuất phát từ nước nông nghiệp lạc hậu nên bỏ qua chế độ tư bản chủ nghĩa."}];
var $=function(s){return document.querySelector(s)},wait=function(t){return new Promise(function(r){setTimeout(r,t)})};
var R=$("#rider"),W=$("#walker"),L=$("#lib"),G=$("#guard"),B=$("#bub"),C=$("#card"),K=$("#book"),P=$("#panel"),S2=$("#bg2"),BG=[$("#bg3"),$("#bg4"),$("#bg5")],busy=false,LP={l:68,t:41};
function pos(x,y,w){R.style.left=x+"%";R.style.top=y+"%";R.style.width=w+"%"}
function say(t,p){B.textContent=t;if(p){B.style.right="auto";B.style.bottom="auto";B.style.left=p.l+"%";B.style.top=p.t+"%";B.style.transform="translate(-50%,-100%)"}else{B.style.left="";B.style.top="";B.style.right="";B.style.bottom="";B.style.transform=""}B.style.opacity=1}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function put(el,x,y,w,o){el.classList.add("nt");el.style.left=x+"%";el.style.top=y+"%";el.style.width=w+"%";if(o!==undefined)el.style.opacity=o;el.offsetWidth;el.classList.remove("nt")}
async function mv(el,x,y,w,t,c){el.style.transitionDuration=t+"ms";el.classList.add(c);el.style.left=x+"%";el.style.top=y+"%";el.style.width=w+"%";await wait(t);el.classList.remove(c)}
async function scene(i){W.classList.add("nt");W.style.opacity=0;W.offsetWidth;W.classList.remove("nt");BG[i].style.opacity=1;await wait(900)}
function reset(){var a=[R,C,W,L,K,S2].concat(BG);a.forEach(function(e){e.classList.add("nt")});
 pos(-15,83,26);R.style.opacity=1;G.style.opacity=1;S2.style.opacity=0;BG.forEach(function(e){e.style.opacity=0});
 C.style.left="73%";C.style.top="75%";C.style.opacity=0;B.style.opacity=0;
 K.style.left="60%";K.style.top="53%";K.style.opacity=0;L.style.opacity=0;L.classList.remove("ext","shake");
 W.style.left="-15%";W.style.top="95%";W.style.width="11%";W.style.opacity=0;W.classList.remove("ext","walk");
 R.offsetWidth;a.forEach(function(e){e.classList.remove("nt")})}
async function ride(x,y,w,t){R.style.transitionDuration=t+"ms";R.classList.add("roll");pos(x,y,w);await wait(t);R.classList.remove("roll")}
function intro(){reset();P.innerHTML='<p style="margin:0 0 10px">Bạn đang đi học buổi sáng. Hãy lái xe đến cổng nhà xe và gặp bác bảo vệ.</p><button class="go" id="go">Lái xe đến cổng</button>';$("#go").onclick=play}
async function play(){P.innerHTML="";reset();await wait(50);await ride(50,83,26,2400);
 G.classList.add("ext");say("Dừng xe nào cháu!");await wait(900);G.classList.remove("ext");
 say("Muốn lấy thẻ gửi xe thì trả lời câu hỏi này nhé!");ask(pick(Q),G,win,null,"Đấu trường dân chủ · Chặng 1")}
function ask(q,npc,done,p,tag){
 var o=shuf(q.o.map(function(t,i){return{t:t,r:i===0}}));
 P.innerHTML='<div class="tag">'+tag+'</div><p class="q">'+q.q+'</p><div class="opts" id="op"></div><div id="fb"></div>';
 var op=$("#op");
 o.forEach(function(x){var b=document.createElement("button");b.className="opt";b.textContent=x.t;b.onclick=function(){
  if(busy)return;
  if(x.r){busy=true;b.classList.add("ok");Array.prototype.forEach.call(op.children,function(e){e.disabled=true});done()}
  else{b.classList.add("bad");b.disabled=true;say("Chưa đúng, thử lại nào!",p);npc.classList.remove("shake");npc.offsetWidth;npc.classList.add("shake");$("#fb").innerHTML='<div class="msg">Gợi ý: '+q.h+'</div>'}
 };op.appendChild(b)})
}
async function win(){
 say("Đúng rồi! Đây, thẻ của cháu.");G.classList.add("ext");C.style.opacity=1;await wait(700);
 C.style.left="56%";C.style.top="63%";await wait(1000);G.classList.remove("ext");say("Gửi xe cẩn thận nhé!");
 P.innerHTML='<span class="chip">🪪 Đã nhận thẻ gửi xe</span>';await wait(1300);
 B.style.opacity=0;C.style.opacity=0;G.style.opacity=0;S2.style.opacity=1;await wait(900);
 R.classList.add("nt");pos(-10,86,15);R.offsetWidth;R.classList.remove("nt");
 await ride(34,86,15,2000);R.style.opacity=0;await ride(43,73,9,1800);
 await stage2()}
async function stage2(){
 P.innerHTML='<span class="chip">🅿️ Xe đã vào nhà xe an toàn</span>';await wait(500);
 put(W,43,73,4,1);await mv(W,52,89,6.5,1800,"walk");await mv(W,112,89,6.5,2200,"walk");
 P.innerHTML='<span class="chip">🚶 Đang đi bộ trong trường…</span>';
 await scene(0);put(W,-8,95,11,1);await mv(W,50,95,11,2600,"walk");
 say("Chết rồi! Mình quên chưa mua sách CNXHKH, phải ra thư viện mượn thôi!",{l:50,t:64});await wait(3000);B.style.opacity=0;
 await mv(W,112,95,11,2800,"walk");
 await scene(1);put(W,-8,96,10,1);await mv(W,112,96,10,4200,"walk");
 await scene(2);L.style.opacity=1;put(W,-8,98,13,1);await mv(W,40,98,13,2600,"walk");
 say("Cháu chào cô ạ! Cô cho cháu mượn quyển giáo trình Chủ nghĩa xã hội khoa học với ạ.",{l:38,t:61});await wait(3200);
 say("Muốn mượn sách thì phải thắng trò chơi này nhé: Đấu trường dân chủ, chặng 2!",LP);
 L.classList.add("ext");await wait(900);L.classList.remove("ext");
 busy=false;ask(pick(Q2),L,win2,LP,"Đấu trường dân chủ · Chặng 2")}
async function win2(){
 say("Giỏi lắm! Đây, giáo trình của cháu.",LP);L.classList.add("ext");K.style.opacity=1;await wait(700);
 W.classList.add("ext");K.style.left="47.5%";K.style.top="74%";await wait(1000);L.classList.remove("ext");
 say("Cháu cảm ơn cô ạ!",{l:38,t:61});await wait(1700);
 say("Nhớ đọc kỹ và trả sách đúng hạn nhé!",LP);
 P.innerHTML='<span class="chip">📘 Đã mượn được giáo trình CNXHKH</span><p style="margin:10px 0"><b>Bạn đã hoàn thành cả hai chặng!</b> Chúc bạn học tốt.</p><button class="go" id="rp">Chơi lại</button>';
 busy=false;$("#rp").onclick=intro}
intro();
</script></body></html>
